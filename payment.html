<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JK P2P — Payment</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><div class="container navwrap"><a class="logo" href="index.html">JK <span>P2P</span></a><nav class="nav"><a href="index.html">Home</a><a href="buy.html">Buy</a><a href="sell.html">Sell</a><a href="support.html">Support</a></nav></div></header>
<main class="container section"><div class="panel" style="max-width:700px;margin:auto"><span class="pill">PAYMENT</span><h1>Complete payment.</h1>
<div class="card"><div class="muted">JK P2P Payment QR</div><div class="qr qr-demo"><div class="qr-grid" aria-label="Demo QR code"></div><span>SCAN TO PAY</span></div>
<div class="row"><span>USDT</span><b id="payUsdt">100 USDT</b></div><div class="row"><span>Amount</span><b id="payInr">₹8,920.00</b></div><div class="row"><span>JK P2P UPI</span><b>jkp2p@upi</b></div>
<p class="tiny muted">Frontend demo only — this QR is a visual placeholder and does not process a real payment.</p></div>
<div class="form" style="margin-top:18px"><label>Payment Screenshot</label><input id="shot" type="file" accept="image/*"><label>UTR / Transaction ID</label><input id="utr" placeholder="Enter UTR"><button class="btn primary" onclick="submitPayment()">Submit Payment Proof</button></div>
</div></main><script src="app.js"></script><script>
(function(){const p=new URLSearchParams(location.search),u=Number(p.get('usdt')),i=Number(p.get('inr'));if(Number.isFinite(u)&&u>0)document.getElementById('payUsdt').textContent=u.toLocaleString('en-IN',{maximumFractionDigits:2})+' USDT';if(Number.isFinite(i)&&i>0)document.getElementById('payInr').textContent='₹'+i.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});})();
</script></body></html>
